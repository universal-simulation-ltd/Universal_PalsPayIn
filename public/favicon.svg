<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#0f172a"/>
  <!-- A coin cracked in two — a bill split between friends. The two shades
       are the two halves; the app never moves the money between them. -->
  <defs>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a1f"/>
      <stop offset="1" stop-color="#e05504"/>
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="9.5" fill="url(#coin)"/>
  <path d="M16 5.5 13.9 10.2 18 13.8 13.9 18.2 18 21.8 16 26.5" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
